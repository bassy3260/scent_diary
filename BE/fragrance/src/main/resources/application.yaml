spring:
  application:
    name: fragrance
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  elasticsearch:
    uris: http://${ES_HOST}:${ES_PORT}

jwt:
  secret: ${JWT_SECRET:default-dev-secret-key-must-be-at-least-256-bits-long-for-hs256}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.fragrance
  configuration:
    map-underscore-to-camel-case: true

fastapi:
#  url: ${FASTAPI_URL:http://j14e102.p.ssafy.io:8126}
  #  url: ${FASTAPI_URL:http://localhost:8000}

s3:
  url: ${S3_URL}

gms:
  url: ${GMS_URL}
  key: ${GMS_KEY}