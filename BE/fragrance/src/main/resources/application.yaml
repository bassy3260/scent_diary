spring:
  application:
    name: fragrance
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  elasticsearch:
    uris: http://${ES_HOST}:${ES_PORT}
    # Spring Boot 기본값(연결 1초/소켓 30초)이 원래도 적용되고 있었지만, 명시적으로
    # 값을 정해서 의도를 남겨둠. 이 프로젝트에서 ES는 향수 1건짜리 단건 upsert/delete가
    # 대부분이라(대량 벌크 작업 아님) 기본 30초보다 짧게 잡아 빨리 실패하고 재시도(outbox
    # 워커의 DLQ 로직)에 맡기는 쪽으로.
    connection-timeout: 3s
    socket-timeout: 10s
  flyway:
    enabled: true
    locations: classpath:db/migration
    # This project's DBs (local + prod) already had this exact schema before
    # Flyway was introduced. baseline-on-migrate marks V1..V4 as already
    # applied (without re-running them) the first time Flyway connects to
    # such a DB, then runs any V5+ normally. A genuinely empty DB (fresh
    # teammate/CI setup) ignores the baseline and just runs V1..V4 for real.
    baseline-on-migrate: true
    baseline-version: "4"
    baseline-description: "pre-flyway schema (adopted 2026-09-05)"

jwt:
  secret: ${JWT_SECRET:default-dev-secret-key-must-be-at-least-256-bits-long-for-hs256}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.fragrance
  configuration:
    map-underscore-to-camel-case: true

fastapi:
  url: ${FASTAPI_URL:http://j14e102.p.ssafy.io:8126}
#    url: ${FASTAPI_URL:http://localhost:8000}

s3:
  url: ${S3_URL}

gms:
  url: ${GMS_URL}
  key: ${GMS_KEY}